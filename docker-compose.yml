services:
  fomo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fomo-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
